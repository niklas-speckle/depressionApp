{% extends "layout.html" %}

{% block title %}
    Choose Questionnaire
{% endblock %}

{% block content %}
    <h1>Choose Questionnaire</h1>

    {% csrf_token %}

    {% for questionnaire in questionnaires %}

    <ul class="questionnaire-list">
        <li><a href="{% url 'symptoms:symptomAssessment' questionnaire_id=questionnaire.id %}">{{questionnaire.name}}</a></li>
    </ul>
        
    {% endfor %}

{% endblock %}
